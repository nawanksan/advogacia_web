version: '3.9'

services:
  db:
    image: postgres:16
    container_name: advogacia_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: advogacia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: advogacia_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DJANGO_DB_HOST: db
      DJANGO_DB_NAME: advogacia
      DJANGO_DB_USER: admin
      DJANGO_DB_PASSWORD: admin123

volumes:
  postgres_data:
